<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Addition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 100px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Number Addition</h1>
    
    <div>
        <label for="num1">Enter first number:</label>
        <input type="text" id="num1" placeholder="e.g., 5">
    </div>

    <div>
        <label for="num2">Enter second number:</label>
        <input type="text" id="num2" placeholder="e.g., 10">
    </div>

    <button id="callButton">Calculate Sum</button>

    <h2>Result: <span id="result"></span></h2>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Function to handle the calculation
            function calculateSum() {
                // Get input values and trim any extra spaces
                const num1 = document.getElementById('num1').value.trim();
                const num2 = document.getElementById('num2').value.trim();

                // Convert input values to numbers
                const a = Number(num1);
                const b = Number(num2);

                // Validate if inputs are valid numbers
                if (num1 === "" || num2 === "" || isNaN(a) || isNaN(b)) {
                    document.getElementById('result').innerText = "❌ Please enter valid numbers.";
                    return;
                }

                // Calculate the sum
                const sum = a + b;

                // Display result
                document.getElementById('result').innerText = `✅ The sum is: ${sum}`;
            }

            // Attach event listener to the button
            document.getElementById("callButton").addEventListener("click", calculateSum);
        });
    </script>
</body>
</html>
